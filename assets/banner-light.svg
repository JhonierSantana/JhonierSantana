<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d"><title id="t">Jhonier Santana — Software Developer</title><desc id="d">Animated banner: name, role, a code snippet and a React atom connected to web, mobile and desktop.</desc><style>
